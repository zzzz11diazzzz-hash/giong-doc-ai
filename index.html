<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Voice Mark AI - Tùy Chỉnh Nâng Cao</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 620px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: white;
            cursor: pointer;
        }
        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            background: #fafbfc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eaeaea;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
        }
        .slider-header span:last-child {
            font-weight: bold;
            color: #3498db;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3498db;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .main-btns {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #speak-btn {
            background-color: #3498db;
        }
        #speak-btn:hover {
            background-color: #2980b9;
        }
        #stop-btn {
            background-color: #e74c3c;
            display: none;
        }
        #stop-btn:hover {
            background-color: #c0392b;
        }
        #download-wav-btn {
            background-color: #27ae60;
            display: none;
        }
        #download-wav-btn:hover {
            background-color: #219150;
        }
        audio {
            width: 100%;
            margin-bottom: 10px;
            display: none;
            border-radius: 10px;
        }
        .note {
            font-size: 13px;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tạo Voice Mark AI (Tùy Chỉnh Nâng Cao)</h2>
    
    <label for="text-input">Nhập nội dung tiếng Anh:</label>
    <textarea id="text-input" placeholder="Nhập câu chuyện của bạn vào đây..."></textarea>
    
    <label for="voice-select">Chọn giọng đọc:</label>
    <select id="voice-select">
        <option value="">Đang tải danh sách giọng...</option>
    </select>

    <div class="sliders-grid">
        <div class="slider-group">
            <div class="slider-header">
                <label for="stability-slider" style="margin:0;">Sự ổn định (Stability)</label>
                <span id="stability-val">75%</span>
            </div>
            <input type="range" id="stability-slider" min="0" max="100" value="75">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label for="clarity-slider" style="margin:0;">Sự khác nhau / Độ rõ (Clarity/Similarity)</label>
                <span id="clarity-val">80%</span>
            </div>
            <input type="range" id="clarity-slider" min="0" max="100" value="80">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label for="rate-slider" style="margin:0;">Tốc độ nói (Speed Rate)</label>
                <span id="rate-val">0.9x</span>
            </div>
            <input type="range" id="rate-slider" min="0.5" max="1.5" step="0.05" value="0.9">
        </div>
    </div>

    <div class="btn-group">
        <div class="main-btns">
            <button id="speak-btn">🎙️ Đọc & Ghi Âm</button>
            <button id="stop-btn">⏹️ Dừng Lại</button>
        </div>
        <button id="download-wav-btn">📥 Tải File WAV (Dùng cho CapCut)</button>
    </div>
    
    <audio id="audio-preview" controls></audio>
    <div class="note" id="status-note">Sẵn sàng tùy chỉnh giọng đọc.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const stabilitySlider = document.getElementById('stability-slider');
    const stabilityVal = document.getElementById('stability-val');
    const claritySlider = document.getElementById('clarity-slider');
    const clarityVal = document.getElementById('clarity-val');
    const rateSlider = document.getElementById('rate-slider');
    const rateVal = document.getElementById('rate-val');

    const speakBtn = document.getElementById('speak-btn');
    const stopBtn = document.getElementById('stop-btn');
    const downloadWavBtn = document.getElementById('download-wav-btn');
    const audioPreview = document.getElementById('audio-preview');
    const statusNote = document.getElementById('status-note');

    let voices = [];
    let audioChunks = [];
    let mediaRecorder;

    stabilitySlider.oninput = () => stabilityVal.textContent = stabilitySlider.value + '%';
    claritySlider.oninput = () => clarityVal.textContent = claritySlider.value + '%';
    rateSlider.oninput = () => rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        voiceSelect.innerHTML = '';
        
        voices.forEach((voice, index) => {
            if (voice.lang.includes('en')) {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                
                if (voice.name.includes('Mark') || voice.name.includes('Guy') || voice.name.includes('David') || voice.name.includes('Natural')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            }
        });
    }

    loadVoices();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    setTimeout(loadVoices, 500);

    function resetState() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
        speakBtn.disabled = false;
        stopBtn.style.display = 'none';
        statusNote.textContent = "Đã dừng lại.";
    }

    stopBtn.addEventListener('click', () => {
        resetState();
    });

    speakBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt không hỗ trợ!');
            return;
        }

        statusNote.textContent = "Đang chuẩn bị ghi âm với thông số đã chọn...";
        speakBtn.disabled = true;
        stopBtn.style.display = 'flex';
        downloadWavBtn.style.display = 'none';
        audioPreview.style.display = 'none';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                const ctx = new AudioContext();
                const dest = ctx.createMediaStreamDestination();
                return dest.stream;
            });

            let mimeType = 'audio/webm';
            if (MediaRecorder.isTypeSupported('audio/wav')) {
                mimeType = 'audio/wav';
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                mimeType = 'audio/mp4';
            }

            mediaRecorder = new MediaRecorder(stream, { mimeType });
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                if (audioChunks.length === 0) return;
                
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                const audioUrl = URL.createObjectURL(audioBlob);
                
                audioPreview.src = audioUrl;
                audioPreview.style.display = 'block';
                downloadWavBtn.style.display = 'flex';
                
                downloadWavBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = audioUrl;
                    a.download = `voice-mark-custom-${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                
                statusNote.textContent = "Đã tạo xong file WAV! Bấm nút xanh lá để tải về.";
                speakBtn.disabled = false;
                stopBtn.style.display = 'none';
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== "" && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            }
            
            const speedRate = parseFloat(rateSlider.value);
            const stability = parseInt(stabilitySlider.value);
            const clarity = parseInt(claritySlider.value);

            utterance.rate = speedRate;
            
            let basePitch = 0.95;
            if (stability < 40) basePitch -= 0.1;
            else if (stability > 80) basePitch = 1.0;

            if (clarity > 80) {
                utterance.pitch = basePitch + (clarity - 80) / 400;
            } else {
                utterance.pitch = basePitch;
            }

            utterance.onstart = () => {
                statusNote.textContent = "Đang đọc văn bản & ghi âm theo thông số cá nhân hóa...";
            };

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 600);
            };

            utterance.onerror = () => {
                resetState();
                statusNote.textContent = "Có lỗi xảy ra khi đọc.";
            };

            window.speechSynthesis.speak(utterance);

        } catch (error) {
            alert("Vui lòng cấp quyền micro để ghi lại file âm thanh.");
            speakBtn.disabled = false;
            stopBtn.style.display = 'none';
            statusNote.textContent = "Lỗi quyền micro.";
        }
    });
</script>

</body>
</html>
