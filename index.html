<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Kể Chuyện & Tải File WAV AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: inherit;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: white;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        #speak-btn {
            background-color: #3498db;
        }
        #speak-btn:hover {
            background-color: #2980b9;
        }
        #download-audio-btn {
            background-color: #27ae60;
            display: none;
        }
        #download-audio-btn:hover {
            background-color: #219150;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            display: none;
            border-radius: 10px;
        }
        .note {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Kể Chuyện Giọng Trầm Ấm (.WAV)</h2>
    
    <label for="text-input">Nhập nội dung kể chuyện (Tiếng Anh):</label>
    <textarea id="text-input" placeholder="Nhập câu chuyện của bạn vào đây... Once upon a time..."></textarea>
    
    <label for="voice-select">Chọn giọng đọc (Ưu tiên giọng trầm ấm):</label>
    <select id="voice-select">
        <option value="">Đang tải danh sách giọng...</option>
    </select>

    <div class="btn-group">
        <button id="speak-btn">🎙️ <span id="btn-text">Kể Chuyện & Ghi Âm</span></button>
        <button id="download-audio-btn">📥 Tải File Voice (.WAV)</button>
    </div>
    
    <audio id="audio-preview" controls></audio>
    <div class="note" id="status-note">Hệ thống đã sẵn sàng xuất file WAV.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const speakBtn = document.getElementById('speak-btn');
    const btnText = document.getElementById('btn-text');
    const downloadAudioBtn = document.getElementById('download-audio-btn');
    const audioPreview = document.getElementById('audio-preview');
    const statusNote = document.getElementById('status-note');

    let voices = [];
    let audioChunks = [];
    let mediaRecorder;

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        voiceSelect.innerHTML = '';
        const preferenceKeywords = ['Guy', 'David', 'Ryan', 'Nathan', 'George', 'Male', 'Natural', 'Google'];

        voices.forEach((voice, index) => {
            if (voice.lang.includes('en')) {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                
                const isPreferred = preferenceKeywords.some(keyword => voice.name.includes(keyword));
                if (isPreferred || voice.name.includes('Natural')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            }
        });
    }

    loadVoices();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    setTimeout(loadVoices, 500);

    speakBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung câu chuyện!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt không hỗ trợ!');
            return;
        }

        statusNote.textContent = "Đang khởi tạo ghi âm...";
        speakBtn.disabled = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                const ctx = new AudioContext();
                const dest = ctx.createMediaStreamDestination();
                return dest.stream;
            });

            // Ép kiểu định dạng ghi âm sang WAV nếu trình duyệt hỗ trợ, nếu không sẽ dùng chuẩn audio chung
            const options = { mimeType: 'audio/webm;codecs=opus' };
            if (MediaRecorder.isTypeSupported('audio/wav')) {
                options.mimeType = 'audio/wav';
            } else if (MediaRecorder.isTypeSupported('audio/x-wav')) {
                options.mimeType = 'audio/x-wav';
            }

            mediaRecorder = new MediaRecorder(stream, options);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPreview.src = audioUrl;
                audioPreview.style.display = 'block';
                downloadAudioBtn.style.display = 'flex';
                
                downloadAudioBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = audioUrl;
                    // Đặt đuôi mở rộng file rõ ràng là .wav
                    a.download = `story-voice-${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                
                statusNote.textContent = "Đã hoàn tất! Bạn có thể nghe lại và tải file WAV về.";
                speakBtn.disabled = false;
                btnText.textContent = "Kể Chuyện & Ghi Âm";
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== "" && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            }
            
            // Giảm tốc độ và hạ độ cao để có giọng trầm ấm kể chuyện
            utterance.rate = 0.9;
            utterance.pitch = 0.95;

            utterance.onstart = () => {
                statusNote.textContent = "Đang kể chuyện với giọng trầm ấm...";
            };

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 500);
            };

            utterance.onerror = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
                statusNote.textContent = "Có lỗi xảy ra.";
                speakBtn.disabled = false;
                btnText.textContent = "Kể Chuyện & Ghi Âm";
            };

            window.speechSynthesis.speak(utterance);

        } catch (error) {
            alert("Vui lòng cấp quyền micro để tạo file âm thanh.");
            speakBtn.disabled = false;
            statusNote.textContent = "Lỗi cấp quyền micro.";
        }
    });
</script>

</body>
</html>
