<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ElevenLabs Voice AI MP3 CapCut</title>

<style>

body{
    font-family:Segoe UI,Tahoma,sans-serif;
    background:#f4f7f6;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}


.container{

    background:white;
    width:100%;
    max-width:620px;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.1);

}


h2{

text-align:center;
color:#333;

}


label{

display:block;
font-weight:600;
margin:12px 0 6px;

}


textarea{

width:100%;
height:140px;

padding:12px;

border-radius:10px;

border:2px solid #ddd;

font-size:15px;

box-sizing:border-box;

}


select,input[type=range]{

width:100%;

}


select{

padding:12px;

border-radius:10px;

border:2px solid #ddd;

margin-bottom:10px;

}


.setting{

background:#fafafa;

padding:15px;

border-radius:10px;

margin-top:15px;

}


.row{

display:flex;
justify-content:space-between;

font-size:14px;

}


input[type=range]{

accent-color:#3498db;

}


button{

width:100%;

padding:13px;

border:none;

border-radius:10px;

font-size:16px;

font-weight:bold;

cursor:pointer;

color:white;

margin-top:15px;

}


#create-btn{

background:#3498db;

}


#create-btn:hover{

background:#2980b9;

}



#download-btn{

background:#27ae60;

}


#download-btn:hover{

background:#219150;

}



audio{

width:100%;

margin-top:20px;

}



.note{

text-align:center;

margin-top:15px;

font-size:14px;

color:#777;

}



</style>

</head>


<body>


<div class="container">


<h2>
🎙️ ElevenLabs Voice AI MP3
</h2>



<label>
Nội dung tiếng Anh
</label>


<textarea id="text"
placeholder="Nhập câu chuyện cần đọc...">
</textarea>




<label>
Chọn giọng
</label>


<select id="voice">


<option value="21m00Tcm4TlvDq8ikWAM">
Rachel - Female
</option>


<option value="EXAVITQu4vr4xnSDxMaL">
Bella - Female
</option>


<option value="TxGEqnHWrfWFTfGW9XjX">
Josh - Male
</option>


</select>





<div class="setting">


<div class="row">

<span>
Stability
</span>

<b id="stabValue">
75%
</b>

</div>


<input 
id="stability"
type="range"
min="0"
max="100"
value="75">






<div class="row">

<span>
Clarity
</span>

<b id="clarityValue">
80%
</b>

</div>


<input 
id="clarity"
type="range"
min="0"
max="100"
value="80">





<div class="row">

<span>
Speed
</span>

<b id="speedValue">
0.9x
</b>

</div>


<input 
id="speed"
type="range"
min="0.5"
max="1.5"
step="0.05"
value="0.9">


</div>





<button id="create-btn">
🎙️ Tạo Voice MP3
</button>



<button id="download-btn">
📥 Tải MP3 cho CapCut
</button>



<audio id="player" controls></audio>



<div class="note" id="status">
Sẵn sàng tạo giọng AI
</div>



</div>






<script>


const API_KEY =
"sk_db2cdfb43e5e52eb5bc072400026451617696e2e1c07b4f8";



const text =
document.getElementById("text");


const voice =
document.getElementById("voice");


const stability =
document.getElementById("stability");


const clarity =
document.getElementById("clarity");


const speed =
document.getElementById("speed");



const stabValue =
document.getElementById("stabValue");


const clarityValue =
document.getElementById("clarityValue");


const speedValue =
document.getElementById("speedValue");



const createBtn =
document.getElementById("create-btn");


const downloadBtn =
document.getElementById("download-btn");


const player =
document.getElementById("player");


const status =
document.getElementById("status");



let mp3Blob=null;



stability.oninput=()=>{

stabValue.textContent=
stability.value+"%";

}



clarity.oninput=()=>{

clarityValue.textContent=
clarity.value+"%";

}



speed.oninput=()=>{

speedValue.textContent=
Number(speed.value).toFixed(2)+"x";

}






createBtn.onclick=async()=>{


const content=
text.value.trim();



if(!content){

alert("Nhập nội dung trước");

return;

}



createBtn.disabled=true;


status.textContent=
"⏳ Đang tạo AI Voice...";



try{


const res=
await fetch(

`https://api.elevenlabs.io/v1/text-to-speech/${voice.value}?output_format=mp3_44100_128`,

{


method:"POST",


headers:{


"Content-Type":
"application/json",


"xi-api-key":
API_KEY


},



body:JSON.stringify({


text:content,


model_id:
"eleven_multilingual_v2",



voice_settings:{


stability:
Number(stability.value)/100,


similarity_boost:
Number(clarity.value)/100,


style:
0.3,


use_speaker_boost:true


},



speed:
Number(speed.value)



})


}

);



if(!res.ok){

throw new Error(
"ElevenLabs lỗi "+res.status
);

}



mp3Blob=
await res.blob();



player.src=
URL.createObjectURL(mp3Blob);



status.textContent=
"✅ Tạo MP3 thành công";


}



catch(err){


console.error(err);


status.textContent=
"❌ "+err.message;


}



finally{


createBtn.disabled=false;


}



}







downloadBtn.onclick=()=>{


if(!mp3Blob){

alert("Chưa có file MP3");

return;

}



const url=
URL.createObjectURL(mp3Blob);



const a=
document.createElement("a");


a.href=url;


a.download=
`voice-ai-${Date.now()}.mp3`;



document.body.appendChild(a);


a.click();


document.body.removeChild(a);



URL.revokeObjectURL(url);


}



</script>


</body>
</html>
