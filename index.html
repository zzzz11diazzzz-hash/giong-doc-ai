<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Văn Bản Thành Giọng Đọc AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
        }
        #speak-btn {
            background-color: #007bff;
        }
        #speak-btn:hover {
            background-color: #0056b3;
        }
        #download-btn {
            background-color: #28a745;
        }
        #download-btn:hover {
            background-color: #218838;
        }
        .note {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Chuyển Văn Bản Thành Giọng Đọc AI</h2>
    
    <label for="text-input">Nhập nội dung:</label>
    <textarea id="text-input" placeholder="Nhập văn bản bạn muốn đọc..."></textarea>
    
    <label for="voice-select">Chọn giọng đọc AI:</label>
    <select id="voice-select">
        <optgroup label="Tiếng Anh (Giọng tự nhiên)">
            <option value="en" selected>Tiếng Anh Chuẩn (Hỗ trợ đọc mượt mà)</option>
        </optgroup>
        <optgroup label="Tiếng Việt">
            <option value="vi">Tiếng Việt Chuẩn</option>
        </optgroup>
    </select>

    <div class="btn-group">
        <button id="speak-btn">🔊 Phát Âm</button>
        <button id="download-btn">📥 Lưu Văn Bản</button>
    </div>
    
    <div class="note" id="status-note">Sẵn sàng đọc văn bản.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const speakBtn = document.getElementById('speak-btn');
    const downloadBtn = document.getElementById('download-btn');
    const statusNote = document.getElementById('status-note');

    speakBtn.addEventListener('click', () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập văn bản trước!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt của bạn không hỗ trợ giọng đọc!');
            return;
        }

        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = voiceSelect.value === 'vi' ? 'vi-VN' : 'en-US';
        utterance.rate = 1.0;

        utterance.onstart = () => {
            statusNote.textContent = "Đang đọc...";
        };

        utterance.onend = () => {
            statusNote.textContent = "Đã đọc xong!";
        };

        utterance.onerror = () => {
            alert('Có lỗi xảy ra khi phát âm thanh.');
            statusNote.textContent = "Lỗi phát âm.";
        };

        window.speechSynthesis.speak(utterance);
    });

    downloadBtn.addEventListener('click', () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung để lưu!');
            return;
        }

        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `van-ban-${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusNote.textContent = "Đã tải file văn bản xuống máy thành công!";
    });
</script>

</body>
</html>
