<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Kể Chuyện Giọng Trầm Ấm AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
        }
        #speak-btn {
            background-color: #007bff;
        }
        #speak-btn:hover {
            background-color: #0056b3;
        }
        #download-audio-btn {
            background-color: #28a745;
            display: none;
        }
        #download-audio-btn:hover {
            background-color: #218838;
        }
        audio {
            width: 100%;
            margin-bottom: 15px;
            display: none;
        }
        .note {
            font-size: 13px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Kể Chuyện Giọng Trầm Ấm AI</h2>
    
    <label for="text-input">Nhập nội dung kể chuyện (Tiếng Anh):</label>
    <textarea id="text-input" placeholder="Nhập câu chuyện của bạn vào đây để giọng trầm ấm đọc..."></textarea>
    
    <label for="voice-select">Chọn giọng đọc trầm ấm:</label>
    <select id="voice-select">
        <option value="">Đang tìm giọng đọc phù hợp...</option>
    </select>

    <div class="btn-group">
        <button id="speak-btn">🎙️ Kể Chuyện & Ghi Âm</button>
        <button id="download-audio-btn">📥 Tải File Âm Thanh</button>
    </div>
    
    <audio id="audio-preview" controls></audio>
    <div class="note" id="status-note">Đã sẵn sàng tạo giọng kể chuyện trầm ấm.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const speakBtn = document.getElementById('speak-btn');
    const downloadAudioBtn = document.getElementById('download-audio-btn');
    const audioPreview = document.getElementById('audio-preview');
    const statusNote = document.getElementById('status-note');

    let voices = [];
    let audioChunks = [];
    let mediaRecorder;

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        
        // Lọc và ưu tiên các giọng nam hoặc giọng trầm ấm, tự nhiên tiếng Anh
        voices.forEach((voice, index) => {
            if (voice.lang.includes('en')) {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = voice.name;
                
                // Ưu tiên chọn các giọng đọc mượt mà chất lượng cao làm mặc định
                if (voice.name.includes('Natural') || voice.name.includes('David') || voice.name.includes('Ryan') || voice.name.includes('Guy') || voice.name.includes('Google UK English Male')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            }
        });
    }

    loadVoices();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    speakBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung câu chuyện!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt không hỗ trợ đọc giọng nói!');
            return;
        }

        statusNote.textContent = "Đang khởi tạo âm thanh...";
        speakBtn.disabled = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                const ctx = new AudioContext();
                const dest = ctx.createMediaStreamDestination();
                return dest.stream;
            });

            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPreview.src = audioUrl;
                audioPreview.style.display = 'block';
                downloadAudioBtn.style.display = 'block';
                
                downloadAudioBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = audioUrl;
                    a.download = `story-audio-${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                
                statusNote.textContent = "Đã kể xong và tạo file thành công!";
                speakBtn.disabled = false;
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== "" && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            }
            // Chỉnh tốc độ chậm lại một chút (0.9) để giọng đọc trở nên trầm ấm và truyền cảm, hợp kể chuyện
            utterance.rate = 0.9; 
            utterance.pitch = 0.95; // Hạ tone giọng xuống thấp một chút cho trầm ấm

            utterance.onstart = () => {
                statusNote.textContent = "Đang kể chuyện với giọng trầm ấm...";
            };

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 500);
            };

            utterance.onerror = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
                statusNote.textContent = "Có lỗi xảy ra khi đọc.";
                speakBtn.disabled = false;
            };

            window.speechSynthesis.speak(utterance);

        } catch (error) {
            alert("Vui lòng cấp quyền micro để ghi lại file âm thanh.");
            speakBtn.disabled = false;
            statusNote.textContent = "Lỗi cấp quyền.";
        }
    });
</script>

</body>
</html>
